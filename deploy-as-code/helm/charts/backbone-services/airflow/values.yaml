# Airflow version and image
airflowVersion: "3.0.2"
defaultAirflowRepository: egovio/airflow
defaultAirflowTag: "3.0.2-custom3"

# Image pull secrets for Docker Hub rate limits
registry:
  secretName: docker-registry-secret

# Executor
executor: "KubernetesExecutor"

# Fernet / JWT / API keys from K8s secrets managed by cluster-configs (SOPS: cluster-configs.secrets.airflow).
# Do not let the chart generate these: Argo CD re-renders the chart on every sync,
# which would rotate them (a new fernet key makes stored connections/variables unreadable)
fernetKeySecretName: "airflow-fernet-key"
jwtSecretName: "airflow-jwt-secret"
apiSecretKeySecretName: "airflow-api-secret-key"

# Redis is only used by CeleryExecutor; disabled so the chart does not render random redis passwords
redis:
  enabled: false

# Airflow config overrides
config:
  api:
    base_url: "/airflow"
    enable_proxy_fix: "True"
  core:
    auth_manager: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    load_examples: "False"
    dags_folder: "/opt/airflow/dags/repo/utilities/airflow-dags/dags"
  webserver:
    base_url: "https://bauchi-hcm.digit.org/airflow"
    enable_proxy_fix: "True"
    rbac: "True"
  fab:
    enable_proxy_fix: "True"
  scheduler:
    standalone_dag_processor: "True"
  logging:
    remote_logging: "False"
    # Option 2 (Azure Blob remote logging) - see the "logs" section below
    # remote_logging: "True"
    # remote_base_log_folder: "wasb-airflow"
    # remote_log_conn_id: "wasb_default"
    # delete_local_logs: "True"
  # azure_remote_logging:
  #   remote_wasb_log_container: "airflow-logs"
  kubernetes_executor:
    delete_worker_pods_on_failure: "False"
  dag_processor:
    parsing_processes: "1"

# DAG Processor
dagProcessor:
  enabled: true
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  livenessProbe:
    timeoutSeconds: 60
  logGroomerSidecar:
    retentionDays: 15


scheduler:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  startupProbe:
    timeoutSeconds: 60
    failureThreshold: 12
  livenessProbe:
    timeoutSeconds: 60
  # Days to keep task logs on the shared logs PVC.
  # The scheduler, triggerer and dag-processor groomers all clean the same volume,
  # so the smallest value wins - keep all three retentionDays equal
  logGroomerSidecar:
    retentionDays: 15

# Git-Sync for DAGs
dags:
  gitSync:
    enabled: true
    repo: "https://github.com/egovernments/health-campaign-services.git"
    branch: "airflow-godeep"
    rev: "HEAD"
    ref: "v2-2-stable"
    depth: 1
    wait: 60
    period: "60s"
    maxFailures: 0
    subPath: ""

# Logs - disable persistent storage for testing (uses emptyDir)
logs:
  persistence:
    enabled: false


# Worker pod template - resource limits for KubernetesExecutor pods
workers:
  resources:
    limits:
      cpu: "200m"
      memory: "768Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"

# Extra environment variables
env:
  - name: AIRFLOW__LOGGING__BASE_LOG_FOLDER
    value: "/opt/airflow/logs"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__AIRFLOW__LOGGING__BASE_LOG_FOLDER
    value: "/opt/airflow/logs"
  - name: AIRFLOW__LOGGING__REMOTE_LOGGING
    value: "False"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__AIRFLOW__LOGGING__REMOTE_LOGGING
    value: "False"
  - name: MDMS_URL
    value: "http://mdms-v2.egov.svc.cluster.local:8080/"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__MDMS_URL
    value: "http://mdms-v2.egov.svc.cluster.local:8080/"
  - name: MDMS_SEARCH_ENDPOINT
    value: "mdms-v2/v2/_search"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__MDMS_SEARCH_ENDPOINT
    value: "mdms-v2/v2/_search"
  - name: TENANT_ID
    value: "ba"
  - name: AIRFLOW__API__WORKERS
    value: "1"
  - name: IS_CENTRAL_INSTANCE_ENABLED
    value: "true"
  - name: CENTRAL_TENANTS
    value: "ba"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__IS_CENTRAL_INSTANCE_ENABLED
    value: "true"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__CENTRAL_TENANTS
    value: "ba"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__TENANT_ID
    value: "ba"
  - name: LIMIT
    value: "100"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__LIMIT
    value: "100"
  - name: FILE_STORE_URL
    value: "http://egov-filestore.egov.svc.cluster.local:8080/"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__FILE_STORE_URL
    value: "http://egov-filestore.egov.svc.cluster.local:8080/"
  - name: FILE_STORE_UPLOAD_FILE_ENDPOINT
    value: "filestore/v1/files"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__FILE_STORE_UPLOAD_FILE_ENDPOINT
    value: "filestore/v1/files"
  - name: CUSTOM_REPORTS_AUTOMATION_TOPIC
    value: "save-hcm-report-metadata"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__CUSTOM_REPORTS_AUTOMATION_TOPIC
    value: "save-hcm-report-metadata"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__K8S_NAMESPACE
    value: "airflow"
  - name: K8S_NAMESPACE
    value: "airflow"

# Extra env vars with valueFrom (secrets)
extraEnv: |
  - name: ELASTIC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elastic
        key: password
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__ELASTIC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elastic
        key: password
  - name: ELASTIC_USERNAME
    valueFrom:
      secretKeyRef:
        name: elastic
        key: username
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__ELASTIC_USERNAME
    valueFrom:
      secretKeyRef:
        name: elastic
        key: username
  - name: KAFKA_BROKER
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__KAFKA_BROKER
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers
  # HCM duplicate pipeline (dags/hcm_dup_pipeline.py): Postgres (read-only user) -> ClickHouse (etl user).
  # extraEnv is also rendered into the KubernetesExecutor worker pod template, so tasks see these.
  # Secret hcm-dup-sync: for now created by backbone-services/clickhouse/create-clickhouse-secrets.sh,
  # later by cluster-configs from the sops secrets file (same name and keys).
  # - name: HCM_CH_HOST
  #   value: "clickhouse.clickhouse.svc.cluster.local"
  # - name: HCM_CH_USER
  #   valueFrom:
  #     secretKeyRef:
  #       name: hcm-dup-sync
  #       key: clickhouse-username
  # - name: HCM_CH_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: hcm-dup-sync
  #       key: clickhouse-password
  - name: HCM_PG_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-host
  - name: HCM_PG_DB
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-name
  - name: HCM_PG_SSLMODE
    value: "require"
  # - name: HCM_PG_USER
  #   valueFrom:
  #     secretKeyRef:
  #       name: hcm-dup-sync
  #       key: pg-username
  # - name: HCM_PG_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: hcm-dup-sync
  #       key: pg-password
  # Option 2 (Azure Blob logging) - connection used by remote_log_conn_id "wasb_default"
  # - name: AIRFLOW_CONN_WASB_DEFAULT
  #   valueFrom:
  #     secretKeyRef:
  #       name: airflow-wasb-connection
  #       key: connection
  # - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__AIRFLOW_CONN_WASB_DEFAULT
  #   valueFrom:
  #     secretKeyRef:
  #       name: airflow-wasb-connection
  #       key: connection
# PostgreSQL (bundled subchart) - passwords from K8s secret "airflow-postgresql-custom"
# Managed by cluster-configs (templates/secrets/airflow-secret.yaml, values from SOPS)
postgresql:
  enabled: true
  auth:
    username: "airflow"
    database: "airflow"
    existingSecret: "airflow-postgresql-custom"
    secretKeys:
      adminPasswordKey: "postgres-password"
      userPasswordKey: "password"
  primary:
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "200m"
        memory: "512Mi"

# Airflow metadata DB connection string from K8s secret "airflow-metadata" (cluster-configs, SOPS)
data:
  metadataSecretName: "airflow-metadata"

# DB migration job - plain Job run as an Argo CD Sync hook (Helm hooks are not used by Argo CD)
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

# UI users - admin (secret "airflow-admin-credentials") and read-only viewer
# (secret "airflow-viewer-credentials"), both managed by cluster-configs (SOPS).
# Runs as an Argo CD PostSync hook, after migrations and all components are healthy.
# "airflow users create" skips users that already exist, so re-running on every sync is safe;
# it does not reset the password of an existing user.
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  defaultUser:
    role: Admin
    username: admin
    email: admin@example.com
    firstName: Admin
    lastName: User
    # Unused - the args below read the password from AIRFLOW_ADMIN_PASSWORD
    password: ""
  args:
    - "bash"
    - "-c"
    - |-
      set -e
      airflow users create -r {{ .Values.createUserJob.defaultUser.role }} -u {{ .Values.createUserJob.defaultUser.username }} -e {{ .Values.createUserJob.defaultUser.email }} -f {{ .Values.createUserJob.defaultUser.firstName }} -l {{ .Values.createUserJob.defaultUser.lastName }} -p "$AIRFLOW_ADMIN_PASSWORD"
      airflow users create -r Viewer -u "$AIRFLOW_VIEWER_USERNAME" -e viewer@example.com -f Read -l Only -p "$AIRFLOW_VIEWER_PASSWORD"
  env:
    - name: AIRFLOW_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: airflow-admin-credentials
          key: password
    # Required by the second "airflow users create" above - without these the job fails (set -e)
    - name: AIRFLOW_VIEWER_USERNAME
      valueFrom:
        secretKeyRef:
          name: airflow-viewer-credentials
          key: username
    - name: AIRFLOW_VIEWER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: airflow-viewer-credentials
          key: password

webserver:
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "1.5Gi"
# StatsD
statsd:
  enabled: true
  resources:
    requests:
      cpu: "50m"
      memory: "63Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

triggerer:
  # Use the shared logs PVC instead of a per-pod disk (runs as a Deployment, not a StatefulSet)
  persistence:
    enabled: false
  logGroomerSidecar:
    retentionDays: 15
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "300m"
      memory: "1Gi"
  livenessProbe:
    timeoutSeconds: 60

apiServer:
  resources:
    requests:
      cpu: "200m"
      memory: "1.5Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# API server ingress - UI at https://mc-nigeria-uat.digit.org/airflow
# Path must match config.api.base_url; cert-manager issues the TLS secret in the airflow namespace
ingress:
  apiServer:
    enabled: true
    ingressClassName: nginx
    path: "/airflow"
    pathType: Prefix
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - name: bauchi-hcm.digit.org
        tls:
          enabled: true
          secretName: bauchi-hcm.digit.org-tls-certs