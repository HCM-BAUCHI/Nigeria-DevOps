# Airflow version and image
airflowVersion: "3.0.2"
defaultAirflowRepository: egovio/airflow
defaultAirflowTag: "3.0.2-custom2"

# Image pull secrets for Docker Hub rate limits
registry:
  secretName: docker-registry-secret

# Executor
executor: "KubernetesExecutor"

# Fernet key
# IMPORTANT for ArgoCD: leaving this empty means the chart auto-generates a key
# via a Helm hook, which can be regenerated on each ArgoCD sync and break
# decryption of connections/variables stored in the metadata DB.
# RECOMMENDED: pre-create a secret containing the fernet key and reference it here,
# OR set `fernetKey` inline (less ideal but works).
# Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
fernetKeySecretName: ""
# fernetKey: "<paste-32-byte-base64-fernet-key-here>"

# Airflow config overrides
config:
  api:
    base_url: "/airflow"
    enable_proxy_fix: "True"
  core:
    auth_manager: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    load_examples: "False"
    dags_folder: "/opt/airflow/dags/repo/utilities/airflow-dags/dags"
  webserver:
    base_url: "https://mc-nigeria-uat.digit.org/airflow"
    enable_proxy_fix: "True"
    rbac: "True"
  fab:
    enable_proxy_fix: "True"
  scheduler:
    standalone_dag_processor: "True"
  logging:
    remote_logging: "False"

# DAG Processor
dagProcessor:
  enabled: true
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

scheduler:
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "300m"
      memory: "1Gi"

# Git-Sync for DAGs
dags:
  gitSync:
    enabled: true
    repo: "https://github.com/egovernments/health-campaign-services.git"
    branch: "airflow-godeep"
    rev: "HEAD"
    ref: "v2-2-stable"
    depth: 1
    wait: 60
    period: "60s"
    maxFailures: 0
    subPath: ""

# Logs - disable persistent storage for testing (uses emptyDir)
logs:
  persistence:
    enabled: false

# Worker pod template - resource limits for KubernetesExecutor pods
workers:
  resources:
    limits:
      cpu: "200m"
      memory: "768Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"

# =============================================================================
# CRITICAL FOR ARGOCD: Disable Helm hooks for migration & user-creation jobs
# =============================================================================
# By default these jobs run as Helm pre/post-install hooks. ArgoCD does not
# handle Helm hooks reliably (it converts them to sync hooks but ordering and
# cleanup behave differently). Setting useHelmHooks: false turns them into
# regular Kubernetes Jobs that ArgoCD manages as normal resources.
# The upstream chart explicitly recommends this for ArgoCD users.

migrateDatabaseJob:
  enabled: true
  useHelmHooks: false
  applyCustomEnv: false

createUserJob:
  enabled: true
  useHelmHooks: false
  applyCustomEnv: false
  # Initial admin user (moved here from the deprecated webserver.defaultUser).
  # In Airflow 3.x, webserver.defaultUser is deprecated — createUserJob is the
  # correct place for this configuration.
  defaultUser:
    role: Admin
    username: admin
    email: admin@example.com
    firstName: Admin
    lastName: User
    password: admin

# Extra environment variables
env:
  - name: AIRFLOW__LOGGING__BASE_LOG_FOLDER
    value: "/opt/airflow/logs"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__AIRFLOW__LOGGING__BASE_LOG_FOLDER
    value: "/opt/airflow/logs"
  - name: AIRFLOW__LOGGING__REMOTE_LOGGING
    value: "False"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__AIRFLOW__LOGGING__REMOTE_LOGGING
    value: "False"
  - name: MDMS_URL
    value: "http://mdms-v2.egov.svc.cluster.local:8080/"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__MDMS_URL
    value: "http://mdms-v2.egov.svc.cluster.local:8080/"
  - name: MDMS_SEARCH_ENDPOINT
    value: "mdms-v2/v2/_search"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__MDMS_SEARCH_ENDPOINT
    value: "mdms-v2/v2/_search"
  - name: TENANT_ID
    value: "ba"
  - name: AIRFLOW__API__WORKERS
    value: "1"
  - name: IS_CENTRAL_INSTANCE_ENABLED
    value: "true"
  - name: CENTRAL_TENANTS
    value: "ba"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__IS_CENTRAL_INSTANCE_ENABLED
    value: "true"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__CENTRAL_TENANTS
    value: "ba"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__TENANT_ID
    value: "ba"
  - name: LIMIT
    value: "100"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__LIMIT
    value: "100"
  - name: FILE_STORE_URL
    value: "http://egov-filestore.egov.svc.cluster.local:8080/"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__FILE_STORE_URL
    value: "http://egov-filestore.egov.svc.cluster.local:8080/"
  - name: FILE_STORE_UPLOAD_FILE_ENDPOINT
    value: "filestore/v1/files"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__FILE_STORE_UPLOAD_FILE_ENDPOINT
    value: "filestore/v1/files"
  - name: KAFKA_BROKER
    value: "release-name-kafka-controller-headless.kafka-cluster.svc.cluster.local:9092"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__KAFKA_BROKER
    value: "release-name-kafka-controller-headless.kafka-cluster.svc.cluster.local:9092"
  - name: CUSTOM_REPORTS_AUTOMATION_TOPIC
    value: "save-hcm-report-metadata"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__CUSTOM_REPORTS_AUTOMATION_TOPIC
    value: "save-hcm-report-metadata"
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__K8S_NAMESPACE
    value: "backbone"
  - name: K8S_NAMESPACE
    value: "backbone"

# Extra env vars with valueFrom (secrets)
extraEnv: |
  - name: _AIRFLOW_WWW_USER_USERNAME
    valueFrom:
      secretKeyRef:
        name: airflow-admin-credentials
        key: username
  - name: _AIRFLOW_WWW_USER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: airflow-admin-credentials
        key: password
  - name: ELASTIC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elastic
        key: password
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__ELASTIC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elastic
        key: password
  - name: ELASTIC_USERNAME
    valueFrom:
      secretKeyRef:
        name: elastic
        key: username
  - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__ELASTIC_USERNAME
    valueFrom:
      secretKeyRef:
        name: elastic
        key: username

# PostgreSQL (bundled subchart)
# Note: if you change postgresPassword on an existing release where the PVC
# already exists, the pod will fail to start because the data dir has a user
# with the old password. Either delete the PVC for a fresh start, or keep
# this value identical to whatever was used the first time the PVC was created.
postgresql:
  enabled: true
  auth:
    postgresPassword: VLXKZUdKbhy4+Q==
  primary:
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "200m"
        memory: "512Mi"

# Webserver - in Airflow 3.x the webserver is largely replaced by apiServer.
# The defaultUser block was moved to createUserJob.defaultUser above
# (webserver.defaultUser is deprecated in the upstream chart).
webserver:
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "1.5Gi"

# StatsD
statsd:
  enabled: true
  resources:
    requests:
      cpu: "50m"
      memory: "63Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

triggerer:
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "200m"
      memory: "1Gi"

apiServer:
  resources:
    requests:
      cpu: "200m"
      memory: "1.5Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"