{{- include "superset.applyEnvOverrides" . }}
{{- if .Values.ingress.enabled }}
# Under ingress.path on the shared host (or "/" on a host of its own); TLS certificate from cert-manager.
# No rewrite: Superset expects the full path (/superset/...) and strips it itself (SUPERSET_APP_ROOT).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.server.timeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"   # dashboard / CSV imports
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}
                port:
                  name: http
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
