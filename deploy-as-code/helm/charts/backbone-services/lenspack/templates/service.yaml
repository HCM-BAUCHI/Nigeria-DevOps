{{- include "lenspack.applyEnvOverrides" . }}
{{- if .Values.enabled }}
# In-cluster only: Superset's /lenspack route forwards here. No Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.labels.app }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
{{- end }}
