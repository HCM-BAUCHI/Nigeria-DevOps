{{- include "lenspack.applyEnvOverrides" . }}
{{- if and .Values.enabled .Values.networkPolicy.enabled }}
# Only Superset's pods may reach Lenspack's port (needs a network plugin that enforces NetworkPolicy)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.labels.app }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.supersetPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
{{- end }}
