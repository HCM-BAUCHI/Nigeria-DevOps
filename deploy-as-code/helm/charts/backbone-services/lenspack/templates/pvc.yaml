{{- include "lenspack.applyEnvOverrides" . }}
{{- if .Values.enabled }}
# The state folder (/data): its Superset login's settings, settings page values, the audit log, usage records,
# saved answers. Never pruned by Argo CD, so turning the chart off keeps it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.name }}-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
