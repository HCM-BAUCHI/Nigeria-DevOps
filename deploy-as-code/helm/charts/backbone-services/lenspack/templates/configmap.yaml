{{- include "lenspack.applyEnvOverrides" . }}
{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
data:
  # Values changed later on the settings page are kept on the PVC and win over this file
  superset.yaml: |
    {{- include "lenspack.config" . | nindent 4 }}
{{- end }}
