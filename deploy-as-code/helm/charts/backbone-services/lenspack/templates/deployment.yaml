{{- include "lenspack.applyEnvOverrides" . }}
{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
spec:
  replicas: 1                   # board bookkeeping is per process: keep one
  strategy:
    type: Recreate              # one pod on the ReadWriteOnce volume at a time
  selector:
    matchLabels:
      app: {{ .Values.labels.app }}
  template:
    metadata:
      labels:
        {{- toYaml .Values.labels | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false   # else the Service injects LENSPACK_PORT=tcp://..., read as the port
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000         # the image's "node" user
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lenspack
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["superset", "--config", "/config/superset.yaml"]
          env:
            - name: LENSPACK_STATE_DIR
              value: /data
            - name: LENSPACK_SUPERSET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.supersetSecretName }}
                  key: {{ .Values.passwordKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: {{ .Values.modelKey }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: {{ .Values.speechKey }}
                  optional: true
            - name: LENSPACK_ADMIN_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: {{ .Values.adminKeysKey }}
                  optional: true
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:               # ready once Superset has given it the key that signs who is asking
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-data
        - name: tmp
          emptyDir: {}
{{- end }}
