# Lenspack server: the "Ask" chat assistant on Superset dashboards (github.com/theflywheel/lenspack, public image).
# Off by default. No Ingress: browsers reach it only through Superset's /lenspack route (backbone-services/superset).
# Environment overrides go under the "lenspack:" key, which the superset chart also reads (one switch, one tag).
# Secrets: superset-secrets/lenspack-password (Superset login) and lenspack-secrets/anthropic-api-key (model key).

name: lenspack
namespace: superset
labels:
  app: lenspack
  group: "infra"

enabled: false

image:
  repository: ghcr.io/theflywheel/lenspack
  tag: "ff551aa"
  pullPolicy: IfNotPresent

port: 8795

supersetUrl: http://superset.superset.svc.cluster.local:8088/superset   # Superset's Service + its ingress path
publicPath: /superset/lenspack                                         # where browsers reach it, through Superset

serviceUser: lenspack           # Superset login, made by the superset chart
supersetSecretName: superset-secrets
passwordKey: lenspack-password

secretName: lenspack-secrets
modelKey: anthropic-api-key
speechKey: openrouter-api-key   # optional; the mic also needs config.features.voice: true
adminKeysKey: admin-api-keys   # optional; "name:scrypt$…" admin API keys (docs/access/admin-api.md)

# Superset datasets the assistant may use. Required before enabling; rows go to the model provider.
datasets: []

# The rest of Lenspack's config (keys, at the pinned version: github.com/theflywheel/lenspack/blob/ff551aa6e4fcda423e5a4bc59d1c3b3d8bd3a106/docs/reference/config.md)
config:
  hostPolicy: superset          # each person sees only what Superset lets them see
  editPolicy: superset          # chat edits follow Superset's dashboard rights
  editScope: own                # only people's own dashboards
  budget:
    usdPerDay: 20               # model spend cap for the whole deployment
    usdPerUserPerDay: 4         # and for each person
  audit:
    retentionDays: 30
  features:
    personalDashboards: false   # off while logins are shared
    voice: false
  auth:
    users: ["Lenspack user"]    # Superset role that sees the Ask button (admins always do)
    admins: ["Lenspack admin"]  # admin role under LENSPACK_ADMIN_ACCESS=superset-role (the default); unused under superset-users
  overlay:
    instructions: ""
    examples: []

extraEnv: []

persistence:
  size: 5Gi
  storageClass: gp3

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# Only Superset's pods may reach port 8795 (only where the network plugin enforces NetworkPolicy)
networkPolicy:
  enabled: false
  supersetPodLabels:
    app: superset
