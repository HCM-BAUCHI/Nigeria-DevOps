# Common Labels
labels:
  app: "goalert"
  group: "monitoring"

namespace: monitoring

# Ingress Configs
# Served as a sub-path off global.domain. GoAlert strips the prefix itself
# (app/inithttp.go wraps the mux in http.StripPrefix), so nginx MUST forward the
# full path -- do NOT add a rewrite-target annotation here.
ingress:
  enabled: true
  context: "goalert"
  waf:
    enabled: false
  additionalAnnotations: |
    nginx.ingress.kubernetes.io/auth-signin: https://$host/oauth2/start?rd=$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-url: https://$host/oauth2/auth
    nginx.ingress.kubernetes.io/auth-response-headers: |
      X-Auth-Request-User,
      X-Auth-Request-Email,
      X-Auth-Request-Groups
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"

# Container Configs
image:
  repository: "goalert/goalert"
  tag: "v0.35.0"

# Keep at 1: the GoAlert engine processes schedules/notifications and only one
# instance per region should do so. Scale out with GOALERT_API_ONLY=true replicas.
replicas: "1"
httpPort: 8081

resources: |
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi

# Probes must include the http prefix -- the pod itself serves /goalert/health.
# Timings are deliberately slack: the first boot runs the full DB migration set.
healthChecks:
  enabled: true
  livenessProbePath: /goalert/health
  readinessProbePath: /goalert/health
  readinessProbe: |
    httpGet:
        path: "{{ .Values.healthChecks.readinessProbePath }}"
        port: {{ .Values.httpPort }}
    initialDelaySeconds: 20
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 30
  livenessProbe: |
    httpGet:
        path: "{{ .Values.healthChecks.livenessProbePath }}"
        port: {{ .Values.httpPort }}
    initialDelaySeconds: 180
    timeoutSeconds: 5
    periodSeconds: 30
    successThreshold: 1
    failureThreshold: 5

# Additional Container Envs
# db-url and data-encryption-key come from the `goalert` Secret in this namespace;
# create it out-of-band (see README.md) before syncing the ArgoCD app.
env: |
  - name: GOALERT_LISTEN
    value: ":{{ .Values.httpPort }}"
  # The path on this URL IS the http prefix -- cmd.go does `cfg.HTTPPrefix = u.Path`.
  # Do NOT also set GOALERT_HTTP_PREFIX: that flag is deprecated as of v0.35.0 and
  # combining the two is a hard startup error ("public-url and http-prefix cannot
  # be used together").
  - name: GOALERT_PUBLIC_URL
    value: "https://{{ .Values.global.domain }}/{{ .Values.ingress.context }}"
  - name: GOALERT_DB_URL
    valueFrom:
      secretKeyRef:
        name: goalert
        key: db-url
  - name: GOALERT_DATA_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        name: goalert
        key: data-encryption-key
  - name: GOALERT_DB_MAX_OPEN
    value: "5"
  - name: GOALERT_DB_MAX_IDLE
    value: "2"
  - name: GOALERT_JSON
    value: "true"
  - name: GOALERT_REGION_NAME
    value: "ng-central-prd"
  - name: GOALERT_KUBERNETES_COOLDOWN
    value: "5s"
