# Common Labels
labels:
  app: "boundary-service"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "boundary-service"

initContainers:
  dbMigration:
    enabled: true
    schemaTable: "boundary_service_schema"
    image:
      repository: "boundary-service-db"

# Container Configs
image:
  repository: "boundary-service"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/boundary-service/health"
  readinessProbePath: "/boundary-service/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx512m -Xms512m"
java-args: "-Dspring.profiles.active=monitoring"
kafka-topics-create-boundary: "create-boundary-entity"
kafka-topics-update-boundary: "update-boundary-entity"
kafka-topics-create-boundary-hierarchy: "save-boundary-hierarchy-definition"
kafka-topics-update-boundary-hierarchy: "update-boundary-hierarchy-definition"
kafka-topics-create-boundary-relationship: "save-boundary-relationship"
kafka-topics-update-boundary-relationship: "update-boundary-relationship"
kafka-topics-bulk-create-boundary-relationship-job: "boundary-relationship-bulk-create-job"

boundary-default-offset: 0
boundary-default-limit: 50
boundary-max-default-limit: 300
boundary-bulk-max-size: 100

spring-kafka-consumer-enable-auto-commit: false
spring-kafka-producer-retries: 3
spring-kafka-producer-batch-size: 16384
spring-kafka-producer-properties-linger-ms: 1
spring-kafka-producer-buffer-memory: "33554432"
spring-kafka-producer-properties-max-block-ms: 15000

memory_limits: "512Mi"
cpu_limits: "150m"

# Additional Container Envs
env: |
  - name: SERVER_CONTEXT_PATH
    value: /boundary-service
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: boundary-service
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: org.apache.kafka.common.serialization.StringSerializer
  {{- if index .Values "global" "serializers-timezone-in-ist" }}
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: org.egov.tracer.kafka.serializer.ISTTimeZoneJsonSerializer
  {{- end }}
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"  
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: JAVA_ENABLE_DEBUG
    value: "true"
  - name: KAFKA_TOPICS_CREATE_BOUNDARY
    value: {{ index .Values "kafka-topics-create-boundary" | quote }}
  - name: KAFKA_TOPICS_CREATE_BOUNDARY_HIERARCHY
    value: {{ index .Values "kafka-topics-create-boundary-hierarchy" | quote }}
  - name: KAFKA_TOPICS_CREATE_BOUNDARY_RELATIONSHIP
    value: {{ index .Values "kafka-topics-create-boundary-relationship" | quote }}
  - name: KAFKA_TOPICS_UPDATE_BOUNDARY_RELATIONSHIP
    value: {{ index .Values "kafka-topics-update-boundary-relationship" | quote }}
  - name: KAFKA_TOPICS_UPDATE_BOUNDARY
    value: {{ index .Values "kafka-topics-update-boundary" | quote }}
  - name: KAFKA_TOPICS_UPDATE_BOUNDARY_HIERARCHY
    value: {{ index .Values "kafka-topics-update-boundary-hierarchy" | quote }}
  - name: KAFKA_TOPICS_BULK_CREATE_BOUNDARY_RELATIONSHIP_JOB
    value: {{ index .Values "kafka-topics-bulk-create-boundary-relationship-job" | quote }}
  - name: BOUNDARY_DEFAULT_OFFSET
    value: {{ index .Values "boundary-default-offset" | quote }}
  - name: BOUNDARY_DEFAULT_LIMIT
    value: {{ index .Values "boundary-default-limit" | quote }}
  - name: BOUNDARY_MAX_DEFAULT_LIMIT
    value: {{ index .Values "boundary-max-default-limit" | quote }}
  - name: BOUNDARY_BULK_MAX_SIZE
    value: {{ index .Values "boundary-bulk-max-size" | quote }}
  - name: SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT
    value: {{ index .Values "spring-kafka-consumer-enable-auto-commit" | quote }}
  - name: SPRING_KAFKA_PRODUCER_RETRIES
    value: {{ index .Values "spring-kafka-producer-retries" | quote }}
  - name: SPRING_KAFKA_PRODUCER_BATCH_SIZE
    value: {{ index .Values "spring-kafka-producer-batch-size" | quote }}
  - name: SPRING_KAFKA_PRODUCER_PROPERTIES_LINGER_MS
    value: {{ index .Values "spring-kafka-producer-properties-linger-ms" | quote }}
  - name: SPRING_KAFKA_PRODUCER_BUFFER_MEMORY
    value: {{ index .Values "spring-kafka-producer-buffer-memory" | quote }}
  - name: SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_BLOCK_MS
    value: {{ index .Values "spring-kafka-producer-properties-max-block-ms" | quote }}
