# Common Labels
labels:
  app: "egov-persister-chad"
  group: "core"

# Init Containers Configs
initContainers:
  gitSync:
    enabled: true
    repo: "git@github.com:egovernments/configs"
    branch: "master"

# Container Configs
image:
  repository: "egov-persister"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/common-persist/health"
  readinessProbePath: "/common-persist/health"
appType: "java-spring"
tracing-enabled: true
persist-yml-path: ""
heap: "-Xmx192m -Xms192m"
java-args: ""
kafka-consumer-group-id: "egov-infra-persist"
# Additional Container Envs
env: |
  - name: EGOV_PERSIST_YML_REPO_PATH
    value: {{ index .Values "persist-yml-path" | quote }}
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: JAEGER_SAMPLER_PARAM
    value: "1"
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: {{ index .Values "kafka-consumer-group-id" | quote }}
