# Default values for commons.
# This is a YAML-formatted file.
# Declare name/value pairs to be passed into your templates.
global:
    containerRegistry: egovio

namespace: egov
replicas: 1
httpPort: 8080
appType: ""

central-instance-build: false
db-schema-names: "ba,oy,ko,na,ab"

ingress:
  enabled: false
  zuul: false
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true" 
  waf: 
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/lua-resty-waf: "active"  
      nginx.ingress.kubernetes.io/lua-resty-waf-debug: "true"
      nginx.ingress.kubernetes.io/lua-resty-waf-score-threshold: "10"
      nginx.ingress.kubernetes.io/lua-resty-waf-allow-unknown-content-types: "true"
      nginx.ingress.kubernetes.io/lua-resty-waf-process-multipart-body: "false"              

image:
  pullPolicy: IfNotPresent   

affinity:
    preferSpreadAcrossAZ: true

initContainers:
  dbMigration:
    enabled: false
    image:
      pullPolicy: IfNotPresent  
      tag: latest
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
          {{- if index .Values "central-instance-build" }}
              key: db-url
          {{- else if eq .Values.namespace "kaduna" }}
              key: kd-db-url
          {{- else if eq .Values.namespace "kebbi-azm" }}
              key: kb-db-url
          {{- else if eq .Values.namespace "jigawa" }}
              key: jg-db-url
          {{- else if eq .Values.namespace "chad-prod" }}
              key: chad-db-url
          {{- else if eq .Values.namespace "bauchi" }}
              key: ba-db-url
          {{- else if eq .Values.namespace "zamfara" }}
              key: zf-db-url
          {{- else if eq .Values.namespace "borno" }}
              key: bo-db-url
          {{- else }}
              key: db-url
          {{- end }}
        - name: "SCHEMA_NAME"
          {{- if and .Values.schemaNameExclude .Values.global.schema }}
          {{- $all := .Values.global.schema }}
          {{- $exclude := .Values.schemaNameExclude }}
          {{- $filtered := $all }}
          {{- range $exclude }}
            {{- $filtered = without $filtered . }}
          {{- end }}
          value: "{{ join "," $filtered }}"
          {{- else if and (index .Values "central-instance-build" | default false) (index .Values "central-instance-enabled" | default false) }}
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-schema-names
          {{- else if eq .Values.namespace "kaduna" }}
          value: "kd"
          {{- else if eq .Values.namespace "kebbi-azm" }}
          value: "kb"
          {{- else if eq .Values.namespace "jigawa" }}
          value: "jg"
          {{- else if eq .Values.namespace "chad-prod" }}
          value: "chad"
          {{- else if eq .Values.namespace "zamfara" }}
          value: "zf"
          {{- else if eq .Values.namespace "borno" }}
          value: "bo"
          {{- else }}
          value: "public"
          {{- end }}
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
                name: db
                key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef: 
                name: db
                key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"        
        - name: "FLYWAY_LOCATIONS"
          valueFrom: 
            configMapKeyRef: 
                name: egov-config
                key: flyway-locations

  gitSync:
    enabled: false
    image:
      repository: registry.k8s.io/git-sync/git-sync
      tag: v4.4.0
      pullPolicy: IfNotPresent   
    env: |
        - name: "GIT_SYNC_REPO"
          value: "{{ .Values.initContainers.gitSync.repo }}"
        - name: "GIT_SYNC_BRANCH"
          value: "{{ .Values.initContainers.gitSync.branch }}"        
        - name: "GIT_SYNC_DEPTH"
          value: "1"            
        - name: "GIT_SYNC_ONE_TIME"
          value: "true"          
        - name: "GIT_SYNC_SSH"
          value: "true"      
        - name: "GIT_SYNC_ROOT"
          value: "/work-dir"

healthChecks:
    enabled: false
    livenessProbe: |
        httpGet:
            path: "{{ .Values.healthChecks.livenessProbePath }}"
            port: {{ .Values.httpPort }}
        initialDelaySeconds: 30
        timeoutSeconds: 3
        periodSeconds: 60
        successThreshold: 1
        failureThreshold: 5
    readinessProbe: |
        httpGet:
            path: "{{ .Values.healthChecks.readinessProbePath }}"
            port: {{ .Values.httpPort }}
        initialDelaySeconds: 30
        timeoutSeconds: 3
        periodSeconds: 30
        successThreshold: 1
        failureThreshold: 5        

lifecycle:
    preStop:
        exec:
            command:
            - sh
            - -c
            - "sleep 10"

memory_limits: "256Mi"
resources: |
  {{- if eq .Values.appType "java-spring" -}}
  requests:
    cpu: {{ .Values.cpu_requests | quote }}
    memory: {{ .Values.memory_requests | quote }}
  limits:
    cpu: {{ .Values.cpu_limits | quote }}
    memory: {{ .Values.memory_limits | quote }}
  {{- end -}}
## Allows specification of additional environment variables
extraEnv:
  java: |
      - name: SPRING_DATASOURCE_URL
        valueFrom:
          configMapKeyRef:
            name: egov-config
            {{- if index .Values "db-read-url-enabled" }}
            {{- if eq .Values.namespace "bauchi" }}
            key: ba-db-read-url
            {{- else if eq .Values.namespace "kaduna" }}
            key: kd-db-read-url
            {{- else if eq .Values.namespace "kebbi-azm" }}
            key: kb-db-read-url
            {{- else if eq .Values.namespace "jigawa" }}
            key: jg-db-read-url
            {{- else if eq .Values.namespace "chad-prod" }}
            key: chad-db-read-url
            {{- else if eq .Values.namespace "zamfara" }}
            key: zf-db-read-url
            {{- else if eq .Values.namespace "borno" }}
            key: bo-db-read-url
            {{- else }}
            key: db-read-url
            {{- end }}
            {{- else if index .Values "db-read-url-enabled-2" }}
            key: db-read-url-2
            {{- else if eq .Values.namespace "bauchi" }}
            key: ba-db-url
            {{- else if eq .Values.namespace "kaduna" }}
            key: kd-db-url
            {{- else if eq .Values.namespace "kebbi-azm" }}
            key: kb-db-url
            {{- else if eq .Values.namespace "jigawa" }}
            key: jg-db-url
            {{- else if eq .Values.namespace "chad-prod"}}
            key: chad-db-url
            {{- else if eq .Values.namespace "zamfara"}}
            key: zf-db-url
            {{- else if eq .Values.namespace "borno" }}
            key: bo-db-url
            {{- else }}
            key: db-url
            {{- end }}
      - name: FLYWAY_ENABLED
        value: "false"      
      - name: SPRING_FLYWAY_ENABLED
        value: "false"      
      - name: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
        value: "/"
      - name: APP_TIMEZONE
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: timezone              
      - name: FLYWAY_URL
        valueFrom:
          configMapKeyRef:
            name: egov-config
            {{- if eq .Values.namespace "bauchi" }}
            key: ba-db-url
            {{- else if eq .Values.namespace "kaduna" }}
            key: kd-db-url
            {{- else if eq .Values.namespace "kebbi-azm" }}
            key: kb-db-url
            {{- else if eq .Values.namespace "jigawa" }}
            key: jg-db-url
            {{- else if eq .Values.namespace "chad-prod" }}
            key: chad-db-url
            {{- else if eq .Values.namespace "zamfara" }}
            key: zf-db-url
            {{- else if eq .Values.namespace "borno" }}
            key: bo-db-url
            {{- else }}
            key: db-url
            {{- end }}
      - name: SPRING_DATASOURCE_USERNAME
        valueFrom:
          secretKeyRef:
            name: db
            key: username
      - name: SPRING_DATASOURCE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: db
            key: password
      - name: SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: spring-datasource-tomcat-initialSize
      - name: SERVER_TOMCAT_MAX_THREADS
      {{- if index .Values "server-tomcat-max-threads" }} 
        value: {{ index .Values "server-tomcat-max-threads" | quote }}    
      {{- else }}        
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: server-tomcat-max-threads
      {{- end }}            
      - name: SERVER_TOMCAT_MAX_CONNECTIONS
      {{- if index .Values "server-tomcat-max-connections" }} 
        value: {{ index .Values "server-tomcat-max-connections" | quote }}    
      {{- else }}        
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: server-tomcat-max-connections
      {{- end }}                
      - name: SPRING_DATASOURCE_TOMCAT_MAX_ACTIVE
      {{- if index .Values "spring-datasource-tomcat-max-active" }}
        value: {{ index .Values "spring-datasource-tomcat-max-active" | quote }}
      {{- else }} 
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: spring-datasource-tomcat-max-active 
      {{- end }}       
      - name: SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE
      {{- if index .Values "spring-datasource-tomcat-max-active" }}
        value: {{ index .Values "spring-datasource-tomcat-max-active" | quote }}
      {{- else }}
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: spring-datasource-tomcat-max-active 
      {{- end }}           
      - name: KAFKA_CONFIG_BOOTSTRAP_SERVER_CONFIG
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: kafka-brokers
      - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: kafka-brokers
      - name: SPRING_JPA_SHOW_SQL
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: spring-jpa-show-sql     
      - name: IS_ENVIRONMENT_CENTRAL_INSTANCE
      {{- if and (index .Values "central-instance-build" | default false) (index .Values "central-instance-enabled" | default false) }}
        value: "true"
      {{- else }}
        value: "false"
      {{- end }}
      - name: STATE_SCHEMA_INDEX_POSITION_TENANTID
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: state-schema-index-position-tenantid
      - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - name: OTEL_TRACES_EXPORTER
        value: none
      - name: OTEL_METRICS_EXPORTER
        value: none
      - name: OTEL_LOGS_EXPORTER
        value: none
        
  jaeger: |             
      - name: JAEGER_SERVICE_NAME
        value: {{ template "common.name" . }}
      - name: JAEGER_SAMPLER_TYPE
        value: remote
      - name: JAEGER_AGENT_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
      - name: JAEGER_AGENT_PORT
        value: "6831"
      - name: JAEGER_SAMPLER_MANAGER_HOST_PORT
        value: "$(JAEGER_AGENT_HOST):5778"
      - name: TRACER_OPENTRACING_ENABLED
        value: "true"         
## Additional init containers
extraInitContainers: |

## Additional sidecar containers
extraContainers: |

## Add additional volumes and mounts, e. g. for custom themes
extraVolumes: |
extraVolumeMounts: |

additionalLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000            

service:
  additionalAnnotations: {}

serviceMonitor:
  honorLabels: true
  # interval: 2m  

cron:
  namespace: egov
  concurrencyPolicy: Forbid
  restartPolicy: OnFailure
  httpPort: 8080
  ## Additional sidecar containers
  extraContainers: |

  ## Add additional volumes and mounts
  extraVolumes: |

  ## Add additional mounts
  extraVolumeMounts: |
