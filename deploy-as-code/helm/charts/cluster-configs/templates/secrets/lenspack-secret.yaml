{{- with index .Values "cluster-configs" "secrets" "lenspack" }}
{{- if index . "anthropic-api-key" }}
---
# Lenspack server (backbone-services/lenspack): the model key and, optionally, the speech-to-text key
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
type: Opaque
data:
  anthropic-api-key: {{ index . "anthropic-api-key" | b64enc | quote }}
{{- if index . "openrouter-api-key" }}
  openrouter-api-key: {{ index . "openrouter-api-key" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
