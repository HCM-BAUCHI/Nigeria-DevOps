{{- with index .Values "cluster-configs" "secrets" "superset" }}
{{- if index . "secret-key" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
type: Opaque
data:
  secret-key: {{ index . "secret-key" | b64enc | quote }}
  admin-password: {{ required "cluster-configs.secrets.superset.admin-password" (index . "admin-password") | b64enc | quote }}
  editor-password: {{ required "cluster-configs.secrets.superset.editor-password" (index . "editor-password") | b64enc | quote }}
  viewer-password: {{ required "cluster-configs.secrets.superset.viewer-password" (index . "viewer-password") | b64enc | quote }}
  redis-password: {{ required "cluster-configs.secrets.superset.redis-password" (index . "redis-password") | b64enc | quote }}
  db-username: {{ required "cluster-configs.secrets.superset.db-username" (index . "db-username") | b64enc | quote }}
  db-password: {{ required "cluster-configs.secrets.superset.db-password" (index . "db-password") | b64enc | quote }}
{{- if index . "clickhouse-password" }}
  clickhouse-password: {{ index . "clickhouse-password" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
