{{- with index .Values "cluster-configs" "secrets" "egov-notification-push" }}
{{- if or (index . "fcm-service-account-key-json") (index . "fcm-service-account-key-json-list") }}
{{- $cfg := . }}
{{- range $ns := (kindIs "slice" .namespace | ternary .namespace (list .namespace)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.name }}
  namespace: {{ $ns }}
type: Opaque
stringData:
  {{- with index $cfg "fcm-service-account-key-json" }}
  fcm-service-account-key-json: {{ . | quote }}
  {{- end }}
  {{- with index $cfg "fcm-service-account-key-json-list" }}
  fcm-service-account-key-json-list: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
