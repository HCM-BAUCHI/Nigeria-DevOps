{{- with index .Values "cluster-configs" "secrets" "egov-filestore" }}
{{- if index . "aws-secret-key" }}
---
{{- range $ns := .namespace }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "egov-filestore" "name" }}
  namespace: {{ $ns }}
type: Opaque
data:
  awskey: {{ index $.Values "cluster-configs" "secrets" "egov-filestore" "aws-key" | b64enc | quote }}
  awssecretkey: {{ index $.Values "cluster-configs" "secrets" "egov-filestore" "aws-secret-key"  | b64enc | quote }}
{{- end }}
---
{{- end }}
{{- end }}

