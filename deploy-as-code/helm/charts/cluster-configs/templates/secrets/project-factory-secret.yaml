{{- with index .Values "cluster-configs" "secrets" "project-factory" }}
{{- if index . "base-secret" }}
{{- $cfg := . }}
{{- range $ns := (kindIs "slice" .namespace | ternary .namespace (list .namespace)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.name }}
  namespace: {{ $ns }}
type: Opaque
stringData:
  base-secret: {{ index $cfg "base-secret" | quote }}
{{- end }}
{{- end }}
{{- end }}
