{{- /*
Airflow secrets referenced by utilities/airflow/values.yaml (names must stay in sync with it).
Values come from cluster-configs.secrets.airflow in the SOPS secrets file.
Nothing is rendered until fernet-key is set there.
*/ -}}
{{- with index .Values "cluster-configs" "secrets" "airflow" }}
{{- if index . "fernet-key" }}
{{- $ns := .namespace }}
---
# fernetKeySecretName - never change once set: a new key makes stored connections/variables unreadable
apiVersion: v1
kind: Secret
metadata:
  name: airflow-fernet-key
  namespace: {{ $ns }}
type: Opaque
data:
  fernet-key: {{ index . "fernet-key" | b64enc | quote }}
---
# jwtSecretName
apiVersion: v1
kind: Secret
metadata:
  name: airflow-jwt-secret
  namespace: {{ $ns }}
type: Opaque
data:
  jwt-secret: {{ required "cluster-configs.secrets.airflow.jwt-secret" (index . "jwt-secret") | b64enc | quote }}
---
# apiSecretKeySecretName
apiVersion: v1
kind: Secret
metadata:
  name: airflow-api-secret-key
  namespace: {{ $ns }}
type: Opaque
data:
  api-secret-key: {{ required "cluster-configs.secrets.airflow.api-secret-key" (index . "api-secret-key") | b64enc | quote }}
---
# postgresql.auth.existingSecret (bundled bitnami postgresql)
apiVersion: v1
kind: Secret
metadata:
  name: airflow-postgresql-custom
  namespace: {{ $ns }}
type: Opaque
data:
  postgres-password: {{ required "cluster-configs.secrets.airflow.postgres-password" (index . "postgres-password") | b64enc | quote }}
  password: {{ required "cluster-configs.secrets.airflow.db-password" (index . "db-password") | b64enc | quote }}
---
# data.metadataSecretName - full SQLAlchemy URL used by Airflow to reach its metadata DB
apiVersion: v1
kind: Secret
metadata:
  name: airflow-metadata
  namespace: {{ $ns }}
type: Opaque
data:
  connection: {{ required "cluster-configs.secrets.airflow.metadata-connection" (index . "metadata-connection") | b64enc | quote }}
---
# createUserJob - Admin UI user
apiVersion: v1
kind: Secret
metadata:
  name: airflow-admin-credentials
  namespace: {{ $ns }}
type: Opaque
data:
  username: {{ required "cluster-configs.secrets.airflow.admin-username" (index . "admin-username") | b64enc | quote }}
  password: {{ required "cluster-configs.secrets.airflow.admin-password" (index . "admin-password") | b64enc | quote }}
---
# createUserJob - read-only Viewer UI user
apiVersion: v1
kind: Secret
metadata:
  name: airflow-viewer-credentials
  namespace: {{ $ns }}
type: Opaque
data:
  username: {{ required "cluster-configs.secrets.airflow.viewer-username" (index . "viewer-username") | b64enc | quote }}
  password: {{ required "cluster-configs.secrets.airflow.viewer-password" (index . "viewer-password") | b64enc | quote }}
{{- end }}
{{- end }}
