{{- with index .Values "cluster-configs" "configmaps" "egov-config" }}
{{- if .data }}
---
{{- range $ns := .namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ index $.Values "cluster-configs" "configmaps" "egov-config" "name" }}
  namespace: {{ $ns }}
data:
{{- $data := deepCopy (index $.Values "cluster-configs" "configmaps" "egov-config" "data") }}
{{- range $key, $value := index (index $.Values "cluster-configs" "configmaps" "egov-config" "namespace-overrides" | default dict) $ns | default dict }}
{{- $_ := set $data $key $value }}
{{- end }}
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
