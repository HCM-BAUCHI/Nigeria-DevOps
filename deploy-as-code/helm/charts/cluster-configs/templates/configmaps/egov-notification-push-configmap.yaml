{{- with index .Values "cluster-configs" "configmaps" "egov-notification-push" }}
  {{- if .data }}
---
  {{- range $ns := .namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ index $.Values "cluster-configs" "configmaps" "egov-notification-push" "name" }}
  namespace: {{ $ns }}
data:
  {{- range $key, $value := index $.Values "cluster-configs" "configmaps" "egov-notification-push" "data" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
{{- end }}
  {{- end }}
  {{- end }}
