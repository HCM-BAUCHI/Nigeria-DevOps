# Common Labels
labels:
  app: "referralmanagement"
  group: "health"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "referralmanagement" 

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "referralmanagement_schema"
    image:
      repository: "referralmanagement-db"

# Container Configs
image:
  repository: "referralmanagement"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/referralmanagement/health"
  readinessProbePath: "/referralmanagement/health"
appType: "java-spring"
downsync-services-enabled: false
heap: "-Xmx192m -Xms192m"
java-args: ""
persist-yml-path: "file:///work-dir/health-campaign-config/egov-persister/referral-management-persister.yml"
indexer-yml-path: "file:///work-dir/health-campaign-config/egov-indexer/referral-management-indexer.yml"

kafka-consumer-group-id: health-referral-management
referralmanagement-sideeffect-kafka-create-topic: save-side-effect-topic
referralmanagement-sideeffect-kafka-update-topic: update-side-effect-topic
referralmanagement-sideeffect-kafka-delete-topic: delete-side-effect-topic
referralmanagement-sideeffect-consumer-bulk-create-topic: save-side-effect-bulk-topic
referralmanagement-sideeffect-consumer-bulk-update-topic: update-side-effect-bulk-topic
referralmanagement-sideeffect-consumer-bulk-delete-topic: delete-side-effect-bulk-topic
referralmanagement-referral-kafka-create-topic: save-referral-topic
referralmanagement-referral-kafka-update-topic: update-referral-topic
referralmanagement-referral-kafka-delete-topic: delete-referral-topic
referralmanagement-referral-consumer-bulk-create-topic: save-referral-bulk-topic
referralmanagement-referral-consumer-bulk-update-topic: update-referral-bulk-topic
referralmanagement-referral-consumer-bulk-delete-topic: delete-referral-bulk-topic
referralmanagement-hfreferral-kafka-create-topic: save-hfreferral-topic
referralmanagement-hfreferral-kafka-update-topic: update-hfreferral-topic
referralmanagement-hfreferral-kafka-delete-topic: delete-hfreferral-topic
referralmanagement-hfreferral-consumer-bulk-create-topic: save-hfreferral-bulk-topic
referralmanagement-hfreferral-consumer-bulk-update-topic: update-hfreferral-bulk-topic
referralmanagement-hfreferral-consumer-bulk-delete-topic: delete-hfreferral-bulk-topic

egov-user-id-validator: "egov-user"
egov-enable-matview-search: "false"
egov-location-code-query-param: "codes"
egov-enc-service-configmap-key: "egov-enc-service"
egov-enc-decrypt-endpoint: "/egov-enc-service/crypto/v1/_decrypt"
egov-service-request-service-search-url: "service-request/service/v1/_search"
egov-service-request-downsync-enabled: "false"
egov-downsync-stale-threshold-hours: "8"
egov-service-request-search-batch-size: "100"
egov-household-member-search-batch-size: "200"
egov-individual-search-batch-size: "200"
egov-project-beneficiary-search-batch-size: "200"
egov-project-task-search-batch-size: "200"
egov-side-effect-search-batch-size: "200"
egov-referral-search-batch-size: "200"
egov-hf-referral-search-batch-size: "200"
egov-s3-bucket: "downsynctest"
egov-s3-region: "af-south-1"
egov-s3-endpoint: ""
egov-s3-presign-endpoint: ""
egov-wardfilegen-ward-pool-size: "8"
egov-wardfilegen-file-pool-size: "32"

# Additional Container Envs
env: |
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: {{ index .Values "kafka-consumer-group-id" | quote }}
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: org.apache.kafka.common.serialization.StringSerializer
  {{- if index .Values "global" "tracer-errors-provideexceptionindetails" }}
  - name: TRACER_ERRORS_PROVIDEEXCEPTIONINDETAILS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: tracer-errors-provideexceptionindetails
  {{- end }}
  - name: EGOV_IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-idgen
  - name: EGOV_IDGEN_PATH
    value: "egov-idgen/id/_generate"
  - name: EGOV_IDGEN_INTEGRATION_ENABLED
    value: "true"
  - name: REFERRALMANAGEMENT_SIDEEFFECT_IDGEN_ID_FORMAT
    value: "referralmanagement.sideeffect.id"
  - name: REFERRALMANAGEMENT_REFERRAL_IDGEN_ID_FORMAT
    value: "referralmanagement.referral.id"
  - name: SPRING_REDIS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-downsync-host
  - name: SPRING_REDIS_PORT
    value: "6379"
  - name: SPRING_CACHE_TYPE
    value: "redis"
  - name: SPRING_CACHE_REDIS_TIME-TO-LIVE
    value: "60"
  - name: SPRING_CACHE_AUTOEXPIRY
    value: "true"
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: JAVA_ENABLE_DEBUG
    value: {{ index .Values "java-enable-debug" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user-egov
  - name: EGOV_SEARCH_USER_URL
    value: "/user/_search"
  - name: EGOV_USER_INTEGRATION_ENABLED
    value: "true"
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: EGOV_LOCATION_HOST
    value: ""
  - name: EGOV_BOUNDARY_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: boundary-service
  - name: EGOV_BOUNDARY_SEARCH_URL
    value: "/boundary-service/boundary/_search"
  - name: EGOV_BOUNDARY_HIERARCHY_NAME
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: boundary-hierarchy
  - name: EGOV_LOCATION_CONTEXT_PATH
    value: "/egov-location/location/v11"
  - name: EGOV_LOCATION_ENDPOINT
    value: "/boundarys/_search"
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: mdms-v2
  - name: EGOV_MDMS_SEARCH_ENDPOINT
    value: "/mdms-v2/v1/_search"
  - name: EGOV_MDMS_PATH
    value: "/mdms-v2/v1/_search"
  - name: MDMS_PATH
    value: "/mdms-v2/v1/_search"
  - name: EGOV_MDMS_INTEGRATION_ENABLED
    value: "true"
  - name: EGOV_MDMS_MASTER_NAME
    value: "referralmanagement_master"
  - name: EGOV_MDMS_MODULE_NAME
    value: "referralmanagement"
  - name: EGOV_PRODUCT_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: product
  - name: EGOV_SEARCH_PRODUCT_VARIANT_URL
    value: "/product/variant/v1/_search"
  {{- if index .Values "downsync-services-enabled" }}
  - name: EGOV_PROJECT_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: project-referral
  - name: EGOV_SEARCH_PROJECT_TASK_URL
    value: "/project-referral/task/v1/_search"
  - name: EGOV_SEARCH_PROJECT_BENEFICIARY_URL
    value: "/project-referral/beneficiary/v1/_search"
  - name: EGOV_SEARCH_PROJECT_STAFF_URL
    value: "/project-referral/staff/v1/_search"
  - name: EGOV_SEARCH_PROJECT_URL
    value: "/project-referral/v1/_search"
  - name: EGOV_SEARCH_PROJECT_FACILITY_URL
    value: "/project-referral/facility/v1/_search"
  - name: EGOV_HOUSEHOLD_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: household-referral
  - name: EGOV_SEARCH_HOUSEHOLD_URL
    value: "/household-referral/v1/_search"
  - name: EGOV_SEARCH_HOUSEHOLD_MEMBER_URL
    value: "/household-referral/member/v1/_search"
  - name: EGOV_INDIVIDUAL_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: individual-referral
  - name: EGOV_SEARCH_INDIVIDUAL_URL
    value: "/individual-referral/v1/_search"
  {{- else }}
  - name: EGOV_PROJECT_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: project
  - name: EGOV_SEARCH_PROJECT_TASK_URL
    value: "/project/task/v1/_search"
  - name: EGOV_SEARCH_PROJECT_BENEFICIARY_URL
    value: "/project/beneficiary/v1/_search"
  - name: EGOV_SEARCH_PROJECT_STAFF_URL
    value: "/project/staff/v1/_search"
  - name: EGOV_SEARCH_PROJECT_URL
    value: "/project/v1/_search"
  - name: EGOV_SEARCH_PROJECT_FACILITY_URL
    value: "/project/facility/v1/_search"
  - name: EGOV_HOUSEHOLD_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: household
  - name: EGOV_SEARCH_HOUSEHOLD_URL
    value: "/household/v1/_search"
  - name: EGOV_SEARCH_HOUSEHOLD_MEMBER_URL
    value: "/household/member/v1/_search"
  - name: EGOV_INDIVIDUAL_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: individual
  - name: EGOV_SEARCH_INDIVIDUAL_URL
    value: "/individual/v1/_search"
  {{- end }}
  - name: EGOV_USER_ID_VALIDATOR
    value: {{ index .Values "egov-user-id-validator" | quote }}
  - name: EGOV_ENC_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: {{ index .Values "egov-enc-service-configmap-key" }}
  - name: EGOV_ENC_DECRYPT_ENDPOINT
    value: {{ index .Values "egov-enc-decrypt-endpoint" | quote }}
  - name: EGOV_SERVICE_REQUEST_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: service-request
  - name: EGOV_SERVICE_REQUEST_SERVICE_SEARCH_URL
    value: {{ index .Values "egov-service-request-service-search-url" | quote }}
  - name: EGOV_SERVICE_REQUEST_DOWNSYNC_ENABLED
    value: {{ index .Values "egov-service-request-downsync-enabled" | quote }}
  - name: EGOV_DOWNSYNC_STALE_THRESHOLD_HOURS
    value: {{ index .Values "egov-downsync-stale-threshold-hours" | quote }}
  - name: EGOV_SERVICE_REQUEST_SEARCH_BATCH_SIZE
    value: {{ index .Values "egov-service-request-search-batch-size" | quote }}
  - name: EGOV_HOUSEHOLD_MEMBER_SEARCH_BATCH_SIZE
    value: {{ index .Values "egov-household-member-search-batch-size" | quote }}
  - name: EGOV_INDIVIDUAL_SEARCH_BATCH_SIZE
    value: {{ index .Values "egov-individual-search-batch-size" | quote }}
  - name: EGOV_PROJECT_BENEFICIARY_SEARCH_BATCH_SIZE
    value: {{ index .Values "egov-project-beneficiary-search-batch-size" | quote }}
  - name: EGOV_PROJECT_TASK_SEARCH_BATCH_SIZE
    value: {{ index .Values "egov-project-task-search-batch-size" | quote }}
  - name: EGOV_SIDE_EFFECT_SEARCH_BATCH_SIZE
    value: {{ index .Values "egov-side-effect-search-batch-size" | quote }}
  - name: EGOV_REFERRAL_SEARCH_BATCH_SIZE
    value: {{ index .Values "egov-referral-search-batch-size" | quote }}
  - name: EGOV_HF_REFERRAL_SEARCH_BATCH_SIZE
    value: {{ index .Values "egov-hf-referral-search-batch-size" | quote }}
  - name: EGOV_S3_BUCKET
    value: {{ index .Values "egov-s3-bucket" | quote }}
  - name: EGOV_S3_REGION
    value: {{ index .Values "egov-s3-region" | quote }}
  - name: EGOV_S3_ENDPOINT
    value: {{ index .Values "egov-s3-endpoint" | quote }}
  - name: EGOV_S3_PRESIGN_ENDPOINT
    value: {{ index .Values "egov-s3-presign-endpoint" | quote }}
  - name: EGOV_S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: referralmanagement
        key: s3-access-key
  - name: EGOV_S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: referralmanagement
        key: s3-secret-key
  - name: EGOV_WARDFILEGEN_WARD_POOL_SIZE
    value: {{ index .Values "egov-wardfilegen-ward-pool-size" | quote }}
  - name: EGOV_WARDFILEGEN_FILE_POOL_SIZE
    value: {{ index .Values "egov-wardfilegen-file-pool-size" | quote }}
  - name: REFERRALMANAGEMENT_SIDEEFFECT_KAFKA_CREATE_TOPIC
    value: {{ index .Values "referralmanagement-sideeffect-kafka-create-topic" | quote }}
  - name: REFERRALMANAGEMENT_SIDEEFFECT_KAFKA_UPDATE_TOPIC
    value: {{ index .Values "referralmanagement-sideeffect-kafka-update-topic" | quote }}
  - name: REFERRALMANAGEMENT_SIDEEFFECT_KAFKA_DELETE_TOPIC
    value: {{ index .Values "referralmanagement-sideeffect-kafka-delete-topic" | quote }}
  - name: REFERRALMANAGEMENT_SIDEEFFECT_CONSUMER_BULK_CREATE_TOPIC
    value: {{ index .Values "referralmanagement-sideeffect-consumer-bulk-create-topic" | quote }}
  - name: REFERRALMANAGEMENT_SIDEEFFECT_CONSUMER_BULK_UPDATE_TOPIC
    value: {{ index .Values "referralmanagement-sideeffect-consumer-bulk-update-topic" | quote }}
  - name: REFERRALMANAGEMENT_SIDEEFFECT_CONSUMER_BULK_DELETE_TOPIC
    value: {{ index .Values "referralmanagement-sideeffect-consumer-bulk-delete-topic" | quote }}
  - name: REFERRALMANAGEMENT_REFERRAL_KAFKA_CREATE_TOPIC
    value: {{ index .Values "referralmanagement-referral-kafka-create-topic" | quote }}
  - name: REFERRALMANAGEMENT_REFERRAL_KAFKA_UPDATE_TOPIC
    value: {{ index .Values "referralmanagement-referral-kafka-update-topic" | quote }}
  - name: REFERRALMANAGEMENT_REFERRAL_KAFKA_DELETE_TOPIC
    value: {{ index .Values "referralmanagement-referral-kafka-delete-topic" | quote }}
  - name: REFERRALMANAGEMENT_REFERRAL_CONSUMER_BULK_CREATE_TOPIC
    value: {{ index .Values "referralmanagement-referral-consumer-bulk-create-topic" | quote }}
  - name: REFERRALMANAGEMENT_REFERRAL_CONSUMER_BULK_UPDATE_TOPIC
    value: {{ index .Values "referralmanagement-referral-consumer-bulk-update-topic" | quote }}
  - name: REFERRALMANAGEMENT_REFERRAL_CONSUMER_BULK_DELETE_TOPIC
    value: {{ index .Values "referralmanagement-referral-consumer-bulk-delete-topic" | quote }}
  - name: REFERRALMANAGEMENT_HFREFERRAL_KAFKA_CREATE_TOPIC
