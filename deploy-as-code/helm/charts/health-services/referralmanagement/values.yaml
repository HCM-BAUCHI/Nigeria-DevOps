  - name: REFERRALMANAGEMENT_HFREFERRAL_KAFKA_UPDATE_TOPIC
    value: {{ index .Values "referralmanagement-hfreferral-kafka-update-topic" | quote }}
  - name: REFERRALMANAGEMENT_HFREFERRAL_KAFKA_DELETE_TOPIC
    value: {{ index .Values "referralmanagement-hfreferral-kafka-delete-topic" | quote }}
  - name: REFERRALMANAGEMENT_HFREFERRAL_CONSUMER_BULK_CREATE_TOPIC
    value: {{ index .Values "referralmanagement-hfreferral-consumer-bulk-create-topic" | quote }}
  - name: REFERRALMANAGEMENT_HFREFERRAL_CONSUMER_BULK_UPDATE_TOPIC
    value: {{ index .Values "referralmanagement-hfreferral-consumer-bulk-update-topic" | quote }}
  - name: REFERRALMANAGEMENT_HFREFERRAL_CONSUMER_BULK_DELETE_TOPIC
    value: {{ index .Values "referralmanagement-hfreferral-consumer-bulk-delete-topic" | quote }}
  - name: SEARCH_API_LIMIT
    value: "1000"
  - name: REFERRALMANAGEMENT_DOCUMENT_ID_VERIFICATION_REQUIRED
    value: "false"
  - name: REFERRALMANAGEMENT_DEFAULT_OFFSET
    value: "0"
  - name: REFERRALMANAGEMENT_DEFAULT_LIMIT
    value: "100"
  - name: REFERRALMANAGEMENT_SEARCH_MAX_LIMIT
    value: "200"
  - name: EGOV_IDGEN_PROJECT_NUMBER_NAME
    value: "project.number"
  - name: PROJECT_RESOURCE_IDGEN_ID_FORMAT
    value: "project.resource.id"
  - name: EGOV_FACILITY_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: facility
  - name: EGOV_SEARCH_FACILITY_URL
    value: "/facility/v1/_search"
