# Common Labels
labels:
  app: "project-factory"
  group: "health"

namespace: egov

# Ingress Configs
ingress:
  namespace: egov
  enabled: true
  zuul: true
  context: "project-factory"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "project_factory_schema"
    image:
      repository: "project-factory-db"

# Container Configs
image:
  repository: "project-factory"
replicas: "3"

# Additional Container Envs
env: |
  - name: KAFKA_BROKER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers 
  - name: KAFKA_SAVE_CAMPAIGN_DETAILS_TOPIC
    value: save-campaign-details
  - name: KAFKA_UPDATE_CAMPAIGN_DETAILS_TOPIC
    value: update-campaign-details
  - name: DB_SCHEMA
    value: "public"
  - name: DEFAULT_TENANT_ID
    value: mz
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: mdms-v2   
  - name: EGOV_MDMS_V2_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: mdms-v2      
  - name: EGOV_MDMS_SEARCH_ENDPOINT
    value: "mdms-v2/v1/_search"
