# Common Labels
labels:
  app: "health-muster-roll"
  group: "health"

namespace: egov

# Ingress Configs
ingress:
  namespace: egov
  enabled: true
  zuul: true
  context: "health-muster-roll"
  additionalAnnotations: |
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "muster_roll_schema"
    image:
      repository: "health-muster-roll-db"

# Container Configs
image:
  repository: "health-muster-roll"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/health-muster-roll/health"
  readinessProbePath: "/health-muster-roll/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx256m -Xms256m"
memory_limits: 512Mi
java-args: ""

musterroll-kafka-create-topic: save-musterroll-health
musterroll-kafka-update-topic: update-musterroll-health
musterroll-kafka-calculate-topic: calculate-musterroll-health
musterroll-attendance-report-generate-topic: generate-attendance-report
musterroll-attendance-report-update-topic: attendance-report-update

notification-sms-enabled: "false"
musterroll-default-limit: "100"
musterroll-search-max-limit: "200"
musterroll-workflow-business-service: "HCMMUSTERROLL"
attendance-log-search-endpoint: "attendance/log/v1/_search"
attendance-register-search-endpoint: "attendance/v1/_search"
attendance-register-update-endpoint: "attendance/v1/_update"
attendance-register-search-limit: "100"
individual-search-endpoint: "individual/v1/_search"
expense-calculator-endpoint: "health-expense-calculator/v1/_estimate"
muster-restricted-search-roles: "ORG_ADMIN,ORG_STAFF"
musterroll-update-recompute-attendance-enabled: "false"
musterroll-individual-entry-roles-enabled: "false"
musterroll-validate-start-date-monday-enabled: "false"
musterroll-validate-attendance-register-enabled: "true"
musterroll-set-default-duration-enabled: "false"
musterroll-add-bank-account-details-enabled: "false"
musterroll-update-attendance-register-review-status-enabled: "true"
musterroll-workflow-enabled: "true"

# Additional Container Envs
env: |
  - name: SERVER_PORT
    value: "8080"
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_CONTEXT_PATH
    value: /health-muster-roll
  - name: SERVER_SERVLET_CONTEXT-PATH
    value: /health-muster-roll
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: mdms-v2
  - name: EGOV_MDMS_SEARCH_ENDPOINT 
    value: /mdms-v2/v1/_search
  - name: EGOV_IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-idgen
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user
  - name: EGOV_WORKFLOW_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-workflow-v2
  - name: WORKS_ATTENDANCE_LOG_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: attendance-service
  - name: WORKS_INDIVIDUAL_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: individual
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-localization
  - name: WORKS_EXPENSE_CALCULATOR_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: health-expense-calculator
  - name: MUSTERROLL_KAFKA_CREATE_TOPIC
    value: {{ index .Values "musterroll-kafka-create-topic" | quote }}
  - name: MUSTERROLL_KAFKA_UPDATE_TOPIC
    value: {{ index .Values "musterroll-kafka-update-topic" | quote }}
  - name: MUSTERROLL_KAFKA_CALCULATE_TOPIC
    value: {{ index .Values "musterroll-kafka-calculate-topic" | quote }}
  - name: KAFKA_TOPICS_NOTIFICATION_SMS
    value: "egov.core.notification.sms"
  - name: EGOV_USER_CONTEXT_PATH
    value: "user"
  - name: EGOV_USER_CREATE_PATH
    value: "/users/_createnovalidate"
  - name: EGOV_USER_SEARCH_PATH
    value: "/v1/_search"
  - name: EGOV_USER_UPDATE_PATH
    value: "/users/_updatenovalidate"
  {{- if index .Values "notification-sms-enabled" }}
  - name: NOTIFICATION_SMS_ENABLED
    value: {{ index .Values "notification-sms-enabled" | quote }}
  {{- end }}
  {{- if index .Values "musterroll-default-offset" }}
  - name: MUSTERROLL_DEFAULT_OFFSET
    value: {{ index .Values "musterroll-default-offset" | quote }}
  {{- end }}
  {{- if index .Values "musterroll-default-limit" }}
  - name: MUSTERROLL_DEFAULT_LIMIT
    value: {{ index .Values "musterroll-default-limit" | quote }}
  {{- end }}
  {{- if index .Values "musterroll-search-max-limit" }}
  - name: MUSTERROLL_SEARCH_MAX_LIMIT
    value: {{ index .Values "musterroll-search-max-limit" | quote }}
  {{- end }}
  {{- if index .Values "musterroll-workflow-business-service" }}
  - name: MUSTERROLL_WORKFLOW_BUSINESS_SERVICE
    value: {{ index .Values "musterroll-workflow-business-service" | quote }}
  {{- end }}
  {{- if index .Values "attendance-log-search-endpoint" }}
  - name: WORKS_ATTENDANCE_LOG_SEARCH_ENDPOINT
    value: {{ index .Values "attendance-log-search-endpoint" | quote }}
  {{- end }}
  {{- if index .Values "attendance-register-search-endpoint" }}
  - name: WORKS_ATTENDANCE_REGISTER_SEARCH_ENDPOINT
    value: {{ index .Values "attendance-register-search-endpoint" | quote }}
  {{- end }}
  {{- if index .Values "attendance-register-update-endpoint" }}
  - name: WORKS_ATTENDANCE_REGISTER_UPDATE_ENDPOINT
    value: {{ index .Values "attendance-register-update-endpoint" | quote }}
  {{- end }}
  {{- if index .Values "attendance-register-search-limit" }}
  - name: WORKS_ATTENDANCE_REGISTER_SEARCH_LIMIT
    value: {{ index .Values "attendance-register-search-limit" | quote }}
  {{- end }}
  {{- if index .Values "individual-search-endpoint" }}
  - name: WORKS_INDIVIDUAL_SEARCH_ENDPOINT
    value: {{ index .Values "individual-search-endpoint" | quote }}
  {{- end }}
  {{- if index .Values "expense-calculator-endpoint" }}
  - name: WORKS_EXPENSE_CALCULATOR_ENDPOINT
    value: {{ index .Values "expense-calculator-endpoint" | quote }}
  {{- end }}
  {{- if index .Values "muster-restricted-search-roles" }}
  - name: MUSTER_RESTRICTED_SEARCH_ROLES
    value: {{ index .Values "muster-restricted-search-roles" | quote }}
  {{- end }}
  - name: EGOV_MDMS_V2_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: mdms-v2
  {{- if index .Values "musterroll-update-recompute-attendance-enabled" }}
  - name: MUSTERROLL_UPDATE_RECOMPUTE_ATTENDANCE_ENABLED
    value: {{ index .Values "musterroll-update-recompute-attendance-enabled" | quote }}
  {{- end }}
  {{- if index .Values "musterroll-individual-entry-roles-enabled" }}
  - name: MUSTERROLL_INDIVIDUAL_ENTRY_ROLES_ENABLED
    value: {{ index .Values "musterroll-individual-entry-roles-enabled" | quote }}
  {{- end }}
  {{- if index .Values "musterroll-validate-start-date-monday-enabled" }}
  - name: MUSTERROLL_VALIDATE_START_DATE_MONDAY_ENABLED
    value: {{ index .Values "musterroll-validate-start-date-monday-enabled" | quote }}
  {{- end }}
  {{- if index .Values "musterroll-add-bank-account-details-enabled" }}
  - name: MUSTERROLL_ADD_BANK_ACCOUNT_DETAILS_ENABLED
    value: {{ index .Values "musterroll-add-bank-account-details-enabled" | quote }}
  {{- end }}
  {{- if index .Values "musterroll-update-attendance-register-review-status-enabled" }}
  - name: MUSTERROLL_UPDATE_ATTENDANCE_REGISTER_REVIEW_STATUS_ENABLED
    value: {{ index .Values "musterroll-update-attendance-register-review-status-enabled" | quote }}
  {{- end }}
  {{- if index .Values "musterroll-workflow-enabled" }}
  - name: MUSTERROLL_WORKFLOW_ENABLED
    value: {{ index .Values "musterroll-workflow-enabled" | quote }}
  {{- end }}
  - name: MUSTERROLL_NOWORKFLOW_CREATE_STATUS
    value: "APPROVAL_PENDING"
  {{- if index .Values "musterroll-validate-attendance-register-enabled" }}
  - name: MUSTERROLL_VALIDATE_ATTENDANCE_REGISTER_ENABLED
    value: {{ index .Values "musterroll-validate-attendance-register-enabled" | quote }}
  {{- end }}
  {{- if index .Values "musterroll-set-default-duration-enabled" }}
  - name: MUSTERROLL_SET_DEFAULT_DURATION_ENABLED
    value: {{ index .Values "musterroll-set-default-duration-enabled" | quote }}
  {{- end }}
  - name: MUSTERROLL_KAFKA_STATUS_UPDATE_TOPIC
    value: {{ index .Values "musterroll-kafka-status-update-topic" | default "muster-roll-status-update" | quote }}
  - name: MUSTERROLL_PERIOD_LOCKING_ENABLED
    value: {{ index .Values "musterroll-period-locking-enabled" | default "true" | quote }}
  - name: MUSTER_ROLL_ATTENDANCE_REPORT_GENERATE_TOPIC
    value: {{ index .Values "musterroll-attendance-report-generate-topic" }}
  - name: MUSTER_ROLL_ATTENDANCE_REPORT_UPDATE_TOPIC
    value: {{ index .Values "musterroll-attendance-report-update-topic" }}
  - name: EGOV_FILESTORE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-filestore
  - name: EGOV_FILESTORE_ENDPOINT
    value: filestore/v1/files
  - name: ELASTICSEARCH_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: es-client
  - name: ELASTICSEARCH_USERNAME
    valueFrom:
      secretKeyRef:
        name: elastic
        key: username
  - name: ELASTICSEARCH_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elastic
        key: password
  - name: EGOV_WORKER_REGISTRY_ENABLED
    value: "true"
  - name: EGOV_WORKER_REGISTRY_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: worker-registry-host
  - name: EGOV_MDMS_V2_SEARCH_ENDPOINT
    value: /mdms-v2/v1/_search
  - name: EGOV_IDGEN_PATH
    value: egov-idgen/id/_generate
  - name: EGOV_IDGEN_MUSTERROLL_NUMBER_NAME
    value: muster.number
  - name: EGOV_LOCALIZATION_SEARCH_ENDPOINT
    value: /localization/messages/v1/_search
  - name: EGOV_WORKFLOW_TRANSITION_PATH
    value: /egov-workflow-v2/egov-wf/process/_transition
  - name: EGOV_WORKFLOW_BUSINESSSERVICE_SEARCH_PATH
    value: /egov-workflow-v2/egov-wf/businessservice/_search
  - name: EGOV_WORKFLOW_PROCESSINSTANCE_SEARCH_PATH
    value: /egov-workflow-v2/egov-wf/process/_search
  - name: MUSTERROLL_WORKFLOW_MODULE_NAME
    value: health-muster-roll
  - name: MUSTERROLL_DEFAULT_DURATION_DAYS
    value: "6"
  - name: MUSTER_CAMPAIGN_SUPERVISOR_ROLE
    value: CAMPAIGN_SUPERVISOR
  - name: WORKS_EXPENSE_CALCULATOR_BILLING_PERIOD_SEARCH_ENDPOINT
    value: /health-expense-calculator/billing-config/v1/periods/_search
  - name: WORKS_EXPENSE_CALCULATOR_BILLING_CONFIG_SEARCH_ENDPOINT
    value: /health-expense-calculator/billing-config/v1/_search
  - name: WORKS_EXPENSE_CALCULATOR_CHECK_BILL_STATUS_ENDPOINT
    value: /health-expense-calculator/v1/_checkBillStatus
  - name: EGOV_FILESTORE_DOWNLOAD_ENDPOINT
    value: filestore/v1/files/id
  - name: EGOV_WORKER_REGISTRY_SEARCH_PATH
    value: worker/v1/_search
  - name: ELASTICSEARCH_QUERIES_MDMS_MODULE
    value: AttendanceReportDetail
  - name: ELASTICSEARCH_QUERIES_MDMS_MASTER
    value: ElasticSearchQuery
  - name: ATTENDANCE_REPORT_FILESTORE_MODULE
    value: ATTENDANCE
  - name: ATTENDANCE_REPORT_LOCALIZATION_MODULE
    value: muster-roll
  - name: ATTENDANCE_REPORT_DATE_FORMAT
    value: dd/MM/yyyy
  - name: ATTENDANCE_REPORT_TIMEZONE
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: timezone
  - name: ATTENDANCE_REPORT_SESSION_BOUNDARY_TIME
    value: "12:00"
  - name: ATTENDANCE_REPORT_ALLOWED_SKILLS
    value: DISTRIBUTOR,REGISTRAR,HEALTH_FACILITY_WORKER
  - name: STATE_LEVEL_TENANTID_LENGTH
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: state-level-tenantid-length
  - name: SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_REQUEST_SIZE
    value: "10485760"
  - name: SPRING_KAFKA_CONSUMER_PROPERTIES_MAX_PARTITION_FETCH_BYTES
    value: "15728640"
  - name: SPRING_KAFKA_CONSUMER_PROPERTIES_FETCH_MAX_BYTES
    value: "15728640"
  