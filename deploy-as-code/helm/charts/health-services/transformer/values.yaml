# Common Labels
labels:
  app: "transformer"
  group: "health"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "transformer"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: false
    schemaTable: "transformer_schema"
    image:
      repository: "transformer-db"

# Container Configs
image:
  repository: "transformer"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/transformer/health"
  readinessProbePath: "/transformer/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx1024m -Xms1024m"
java-args: ""
memory_limits: "1Gi"
save-project-task-topic: "save-project-task-topic"
update-project-task-topic: "update-project-task-topic"
transformer-producer-bulk-project-task-index-v1-topic: "transformer-producer-bulk-project-task-index-v1-topic"
save-project-staff-topic: "save-project-staff-topic"
update-project-staff-topic: "update-project-staff-topic"
transformer-producer-bulk-project-staff-index-v1-topic: "transformer-producer-bulk-project-staff-index-v1-topic"
transformer-producer-bulk-project-index-v1-topic: "transformer-producer-bulk-project-index-v1-topic"
save-project: "save-project"
update-project: "update-project"
save-household-member-topic: "save-household-member-topic"
transformer-producer-household-member-index-v1-topic: "transformer-producer-household-member-index-v1-topic"
save-household-topic: "save-household-topic"
update-household-topic: "update-household-topic"
transformer-producer-service-index-v2-topic: "transformer-producer-service-index-v2-topic"
save-stock-topic: "save-stock-topic"
update-stock-topic: "update-stock-topic"
transformer-producer-bulk-stock-index-v1-topic: "transformer-producer-bulk-stock-index-v1-topic"
save-facility-topic: "save-facility-topic"
update-facility-topic: "update-facility-topic"
save-service: "save-service"
transformer-producer-service-request-index-v1-topic: "transformer-producer-service-request-index-v1-topic"
save-referral-topic: "save-referral-topic"
transformer-producer-referral-index-v1-topic: "transformer-producer-referral-index-v1-topic"
update-referral-topic: "update-referral-topic"
save-side-effect-topic: "save-side-effect-topic"
update-side-effect-topic: "update-side-effect-topic"
transformer-producer-side-effect-index-v1-topic: "transformer-producer-side-effect-index-v1-topic"
save-pgr-request: "save-pgr-request"
transformer-save-pgr-request: "transformer-save-pgr-request"
transformer-producer-household-index-v1-topic: "transformer-producer-household-index-v1-topic"
update-pgr-request: "update-pgr-request"
save-hfreferral-topic: "save-hfreferral-topic"
update-hfreferral-topic: "update-hfreferral-topic"
transformer-producer-hfreferral-index-v1-topic: "transformer-producer-hfreferral-index-v1-topic"
transformer-producer-hfreferral-service-index-topic: "transformer-producer-hfreferral-service-index-topic"
transformer-producer-finance-checklist-index-v1-topic: "transformer-producer-finance-checklist-index-v1-topic"
transformer-producer-special-spraying-index-topic: "transformer-producer-special-spraying-index-topic"
save-attendance-log: "save-attendance-log"
update-attendance-log: "update-attendance-log"
transformer-save-attendance-log: "transformer-save-attendance-log"
transformer-save-attendance-register: "transformer-save-attendance-register"
transformer-producer-extra-transformed-checklist-index-topic: "transformer-producer-extra-transformed-checklist-index-topic"
update-household-member-topic: "update-household-member-topic"
save-stock-reconciliation-topic: "save-stock-reconciliation-topic"
update-stock-reconciliation-topic: "update-stock-reconciliation-topic"
transformer-producer-stock-recon-index-v1-topic: "transformer-producer-stock-recon-index-v1-topic"
health-transformer: "health-transformer"
# Additional Container Envs
env: |
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: {{ index .Values "health-transformer" | quote }}
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: org.apache.kafka.common.serialization.StringSerializer
  - name: SPRING_KAFKA_CONSUMER_PROPERTIES_SESSION_TIMEOUT_MS
    value: "240000"
  - name: SPRING_KAFKA_CONSUMER_PROPERTIES_HEARTBEAT_INTERVAL_MS
    value: "30000"
  - name: SPRING_KAFKA_CONSUMER_PROPERTIES_MAX_POLL_INTERVAL_MS
    value: "600000" 
  {{- if index .Values "global" "tracer-errors-provideexceptionindetails" }}
  - name: TRACER_ERRORS_PROVIDEEXCEPTIONINDETAILS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: tracer-errors-provideexceptionindetails
  {{- end }}
