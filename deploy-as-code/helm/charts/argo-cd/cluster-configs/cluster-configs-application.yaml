apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ng-central-prd-cluster-configs
  namespace: argocd
spec:
  project: cluster-configs-project
  sources:
    - repoURL: git@github.com:HCM-BAUCHI/Nigeria-Devops.git
      targetRevision: ng-central-prd
      path: "deploy-as-code/helm/charts/cluster-configs"
      helm:
        valueFiles:
          - values.yaml
          - ../../environments/bauchi-central-prd.yaml
          - secrets://../../environments/bauchi-central-prd-secrets.yaml
  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas