apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ng-central-prd-egov-appset-core
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: pdf-service
          - name: service-request
          - name: egov-notification-mail
          - name: egov-notification-push
          - name: boundary-service

  template:
    metadata:
      name: 'egov-{{name}}'

    spec:
      project: egov-project

      source:
        repoURL: git@github.com:HCM-BAUCHI/Nigeria-Devops.git
        targetRevision: ng-central-prd
        path: deploy-as-code/helm/charts/core-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../environments/bauchi-central-prd.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: '*'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
