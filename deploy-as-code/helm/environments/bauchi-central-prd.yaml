ingress-nginx:
  default-backend-service: "egov/nginx"
  cert-issuer: "letsencrypt-prod"
  ssl-protocols: "TLSv1.2 TLSv1.3"
  ssl-ciphers: "EECDH+CHACHA20:EECDH+AES"
  ssl-ecdh-curve: "X25519:prime256v1:secp521r1:secp384r1"
  controller:
    replicas: 5
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
    addHeaders:
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "SAMEORIGIN"
      X-XSS-Protection: "1; mode=block"
      Access-Control-Allow-Origin: "https://bauchi-hcm.digit.org, https://oyo-hcm.digit.org, https://kogi-hcm.digit.org, https://nasarawa-hcm.digit.org, https://fct-abuja-hcm.digit.org, https://plateau-hcm.digit.org, https://borno-hcm.digit.org, https://kebbi-hcm-central.digit.org, https://sokoto-hcm.digit.org, https://ondo-hcm.digit.org, https://chad-hcm-prod.digit.org"
      Access-Control-Allow-Methods: "GET, POST, OPTIONS"
      Access-Control-Allow-Headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range"
    # setSslTls: "gcp-test.digit.org-tls-certs"


