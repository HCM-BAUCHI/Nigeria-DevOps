airflow-trigger:
  initContainers:
    extraInitContainers: |
      - name: run-migration
        image: bhanuprakashmegov/airflow-custom-trigger:central4
        command: [ "python", "migrate.py" ]
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: egov-config
                key: db-host
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: egov-config
                key: db-name
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: db
                key: username
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db
                key: password
          - name: DB_SCHEMAS
            value: "oy,ko,na,jg"
  image:
    repository: "bhanuprakashmegov/airflow-custom-trigger"
    tag: "central4"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
  cpu_requests: 100m
  memory_requests: 128Mi
  cpu_limits: 150m
  memory_limits: 256Mi


egov-filestore:
  initContainers:
    dbMigration:
      image:
        repository: egovio/egov-filestore-db
