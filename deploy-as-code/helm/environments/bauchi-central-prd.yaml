global:
  domain: bauchi-hcm.digit.org
  setup: fullsetup
  tracing-enabled: true
  hosts:
    - bauchi-hcm.digit.org
    - oyo-hcm.digit.org
  schema:
    - ba
    - oy

cluster-configs:
  namespaces:
    create: true
    values: [ backbone, cert-manager, egov, es-cluster, kafka-cluster, logging, monitoring, playground, zookeeper-cluster, es-cluster-v8, jupyter, jhub, bauchi, oyo ]

  root-ingress:
    cert-issuer: letsencrypt-prod
  configmaps:
    egov-config:
      namespace: [egov]
      data:
        db-host: "ng-central-prd-db.cpe4q0cycqi7.af-south-1.rds.amazonaws.com" ## Add db-host name eg: egov-demo.database.azure.com
        db-name: "ngcentralprd" ## Add db-name
        db-url: "jdbc:postgresql://ng-central-prd-db.cpe4q0cycqi7.af-south-1.rds.amazonaws.com:5432/ngcentralprd" ## example: jdbc:postgresql://egov-demo.postgres.database.azure.com:5432/egov_demo
        domain: "bauchi-hcm.digit.org" ## Add your Domain Name
        redis-host: "redis.backbone"
        redis-downsync-host: "redis.backbone"
        egov-services-fqdn-name: "https://bauchi-hcm-digit.org/" ## Add your Domain Name
        state-level-tenantid-length: "1"
        state-schema-index-position-tenantid: "0"
        is-environment-central-instance: "true"
        aws-cluster-ip: "https://AD11FA377F3AEE4369833D9626BD7A83.gr7.af-south-1.eks.amazonaws.com"
        aws-region: "af-south-1"
        aws-cluster-name: "arn:aws:iam::022499048165:role/ng-central-prd-cluster-20250509110729607700000001"
        egov-state-level-tenant-id: "ba"
        state-level-tenant-id: "ba"
        s3-assets-bucket: "(central-instance-assets)"
        es-host: "elasticsearch-data.es-cluster-v8"
        es-indexer-host: "https://elasticsearch-data.es-cluster-v8:9200/"
        flyway-locations: "filesystem:/flyway/sql,filesystem:/flyway/seed,filesystem:/flyway/qa"
        kafka-brokers: "release-name-kafka-controller-headless.kafka-cluster:9092"
        kafka-infra-brokers: "release-name-kafka-controller-headless.kafka-cluster:9092"
        logging-level-jdbc: "DEBUG"
        mobile-validation-workaround: "true"
        serializers-timezone-in-ist: "true"
        server-tomcat-max-connections: "500"
        server-tomcat-max-threads: "10"
        sms-enabled: "true"
        spring-datasource-tomcat-initialSize: "1"
        spring-datasource-tomcat-max-active: "2"
        spring-jpa-show-sql: "true"
        timezone: "UTC"
        tracer-errors-provideexceptionindetails: "true"
        egov-env: "PROD"
        boundary-hierarchy: "ADMIN"
        egov-internal-microservice-user-uuid: "e1f57dfe-35a0-494a-911d-22cd3f786612"
        host-map: "{'ba':'https://bauchi-hcm.digit.org/','oy':'https://oyo-hcm.digit.org/'}"

    egov-service-host:
      namespace: [egov, monitoring]
      data:
        dashboard-analytics: "http://dashboard-analytics.egov:8080/"
        egov-enc-service: "http://egov-enc-service.egov:8080/"
        egov-accesscontrol: "http://egov-accesscontrol.egov:8080/"
        egov-user: "http://egov-user.egov:8080/"
