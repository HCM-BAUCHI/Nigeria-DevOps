  save-hfreferral-topic: "chad-save-hfreferral-topic"
  update-hfreferral-topic: "chad-update-hfreferral-topic"
  transformer-producer-hfreferral-index-v1-topic: "chad-transformer-producer-hfreferral-index-v1-topic"
  transformer-producer-hfreferral-service-index-topic: "chad-transformer-producer-hfreferral-service-index-topic"
