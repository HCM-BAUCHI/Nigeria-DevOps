  transformer-producer-service-index-v2-topic: "chad-transformer-producer-service-index-v2-topic"
  save-stock-topic: "chad-save-stock-topic"
  update-stock-topic: "chad-update-stock-topic"
  transformer-producer-bulk-stock-index-v1-topic: "chad-transformer-producer-bulk-stock-index-v1-topic"
  save-facility-topic: "chad-save-facility-topic"
  update-facility-topic: "chad-update-facility-topic"
  save-service: "chad-save-service"
  transformer-producer-service-request-index-v1-topic: "chad-transformer-producer-service-request-index-v1-topic"
  save-referral-topic: "chad-save-referral-topic"
  transformer-producer-referral-index-v1-topic: "chad-transformer-producer-referral-index-v1-topic"
  update-referral-topic: "chad-update-referral-topic"
