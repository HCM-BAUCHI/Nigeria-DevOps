transformer:
  namespace: "chad-prod"
  heap: "-Xmx1280m -Xms1024m"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
  cpu_requests: 200m
  memory_requests: 1Gi
  cpu_limits: 400m
  memory_limits: 1.5Gi
  java-enable-debug: false
  save-project-task-topic: "chad-save-project-task-topic"
  update-project-task-topic: "chad-update-project-task-topic"
  transformer-producer-bulk-project-task-index-v1-topic: "chad-transformer-producer-bulk-project-task-index-v1-topic"
  save-project-staff-topic: "chad-save-project-staff-topic"
