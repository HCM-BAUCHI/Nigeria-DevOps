global:
  domain: namibia-hcm.digit.org
  setup: fullsetup
  tracing-enabled: true
  hosts:
    - namibia-hcm.digit.org
  schema:
    - namibia

disableAnnotationTimestamp: true

# render-time presence flag only; real configmaps come from bauchi-central-prd cluster-configs
cluster-configs:
  configmaps:
    egov-config:
      data:
        redis-host: "from-bauchi-egov-config"
    egov-service-host:
      data: {}

household:
  namespace: hcm22
  ingress:
    name: hcm22-household
    namespace: egov
    gatewayService: gateway-hcm22
  kafka-consumer-group-id: "hcm22-health-household"
  db-read-url-enabled: true
  initContainers:
    dbMigration:
      image:
        repository: egovio/household-db
        tag: HCMPRE-2656-HCM-Services-Household-5717dde
  image:
    repository: egovio/household
    tag: HCMPRE-2656-HCM-Services-Household-5717dde
  spring-datasource-tomcat-max-active: "5"
  server-tomcat-max-threads: "10"
  central-instance-build: true
  central-instance-enabled: true
  heap: "-Xmx1024m -Xms512m"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  cpu_requests: 300m
  memory_requests: 1Gi
  cpu_limits: 400m
  memory_limits: 1.5Gi
  extraEnv:
    app: |
      - name: TRACER_ERRORSPUBLISH
        value: "true"
      - name: TRACER_ERRORSTOPIC
        value: "error-details-indexer-topic"

